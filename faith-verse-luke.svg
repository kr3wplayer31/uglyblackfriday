<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900">
<rect width="900" height="900" fill="#fff6e5"/>
<rect x="36" y="36" width="828" height="828" fill="none" stroke="#c78f00" stroke-width="6"/>
<rect x="56" y="56" width="788" height="788" fill="none" stroke="#c78f00" stroke-width="2"/>
<polygon points="450,110 464,168 524,182 464,196 450,254 436,196 376,182 436,168" fill="#ffc400"/>
<text x="450" y="360" text-anchor="middle" font-family="Georgia,serif" font-size="54" fill="#7a0c1d">For unto you is born</text>
<text x="450" y="428" text-anchor="middle" font-family="Georgia,serif" font-size="54" fill="#7a0c1d">this day in the city</text>
<text x="450" y="496" text-anchor="middle" font-family="Georgia,serif" font-size="54" fill="#7a0c1d">of David a Saviour,</text>
<text x="450" y="564" text-anchor="middle" font-family="Georgia,serif" font-size="54" fill="#7a0c1d">which is Christ</text>
<text x="450" y="632" text-anchor="middle" font-family="Georgia,serif" font-size="54" fill="#7a0c1d">the Lord.</text>
<text x="450" y="716" text-anchor="middle" font-family="Georgia,serif" font-size="36" fill="#14532d" letter-spacing="4">— LUKE 2:11 (KJV) —</text>
<text x="450" y="790" text-anchor="middle" font-family="Georgia,serif" font-size="30" fill="#7a4a21" letter-spacing="3">JESUS IS THE REASON FOR THE SEASON</text>
</svg>
